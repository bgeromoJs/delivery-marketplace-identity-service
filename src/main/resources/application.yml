server:
  port: 8081

spring:
  profiles:
    default: local
  application:
    name: identity-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/identity_db}
    driverClassName: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgrespassword}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  security:
    jwt:
      secret: ${JWT_SECRET:deliveryhub-local-only-secret-key-change-before-deploy-2026}
      issuer: deliveryhub-identity
      ttl-minutes: 60
management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  seed:
    demo-data: false
    admin-phone: ${ADMIN_PHONE:}
  sms:
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_FROM_NUMBER:}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    issuer: ${GOOGLE_ISSUER:https://accounts.google.com}
    jwk-set-uri: ${GOOGLE_JWK_SET_URI:https://www.googleapis.com/oauth2/v3/certs}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true

logging:
  level:
    root: INFO # Nível padrão para toda a aplicação (pode usar DEBUG para mais detalhes)
    com.seuprojeto: DEBUG # Substitua pelo pacote raiz do seu código (ex: com.deliveryhub.identity)
    org.springframework.web: DEBUG # Mostra detalhes das requisições HTTP recebidas
    org.hibernate.SQL: DEBUG # Exibe as queries SQL executadas no console (alternativa ao show-sql: true)
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE # Exibe os parâmetros que vão para o banco nas queries